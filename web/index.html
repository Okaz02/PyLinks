<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/main.css">
    <script type="module" src="./js/editor.js"></script>
    <script type="module" src="./js/codegen.js"></script>
    <script type="module" src="./js/history.js"></script>
</head>

<body>
    <div id="tab">
        <details class="tab-btn">
            <summary>
                File
            </summary>
            <div class="tab-menu">
                <p>Open folder</p>
                <p id="menu-open-file">Open file</p>
                <p>New python file</p>
                <p id="menu-export">Export</p>
            </div>
        </details>
        <details class="tab-btn">
            <summary>
                Edit
            </summary>
            <div class="tab-menu">
                <p id="menu-undo">Undo</p>
                <p id="menu-redo">Redo</p>
                <p>Copy</p>
                <p>Paste</p>
            </div>
        </details>
    </div>
    <div id="workspace">
        <div id="blocks-box">
            <div id="tools-box">
                <div id="tools-box-header">
                    <input class="input-field" id="tools-box-input" type="text">
                </div>
                <div id="tools-box-body">
                </div>
            </div>
        </div>
        <div id="document-box">
        </div>
    </div>
</body>

</html>

<template id="spin-template">
    <svg class="spinner" viewBox="0 0 50 50">
        <circle class="spinner-path" cx="25" cy="25" r="20" fill="none" stroke-width="5" />
    </svg>
</template>

<template id="add-block-btn-template">
    <button class="add-block-btn">
        <div class="add-block-icon icon-add"></div>
        ADD
    </button>
</template>

<template id="control-block-template">
    <div class="control-block">
        <div class="control-block-header">
            <div class="control-block-color"></div>
            <div class="control-block-header-content"></div>
        </div>

        <div class="control-block-body">
            <div class="control-block-indent"></div>
            <div class="control-block-body-content"></div>
        </div>
    </div>
</template>

<template id="block-template">
    <div class="block">
        <div class="block-color"></div>
        <div class="block-slide"></div>
    </div>
</template>

<template id="input-template">
    <input class="input-field" type="text">
</template>

<template id="add-btn-template">
    <button class="btn-icon icon-add btn-add" aria-label="Add"></button>
</template>

<template id="delete-btn-template">
    <button class="btn-icon icon-close delete-btn" aria-label="Delete"></button>
</template>
